<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sher</title>
</head>

<body>
    <div class="sher">
        <div id="insert">
            <div>ram ram </div>
        </div>
    </div>
</body>
<script>
    const insert = document.querySelector("#insert")

    window.addEventListener("keydown", function (e) {
        insert.innerHTML = `
        <div class="table">

            <table>
  <tr>
    <th>key</th>
    <th>keycode</th>
    <th>code</th>
  </tr>
  <tr>
    <td>${e.key === " "?"space":e.key}</td>
    <td>${e.keyCode}</td>
    <td>${e.code}</td>
  </tr>
  
</table>
            
            
            </div>


        `
    })
</script>

</html>
